<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="660" fill="white"/>
  <defs>
    <marker id="filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222"/>
    </marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="24" text-anchor="middle" font-size="16" font-weight="bold">Flujo de Intercepción Global de Excepciones en Spring Boot</text>

  <!-- Leyenda -->
  <text x="30" y="55" font-size="12" font-weight="bold">Leyenda</text>
  <rect x="30" y="65" width="16" height="12" fill="#e8e8e8" stroke="#333"/>
  <text x="52" y="75" font-size="11">Cliente HTTP / Front-end</text>
  <rect x="30" y="83" width="16" height="12" fill="#fff3c4" stroke="#333"/>
  <text x="52" y="93" font-size="11">Componentes de Aplicación (@RestController, @Service)</text>
  <rect x="30" y="101" width="16" height="12" fill="#d4edda" stroke="#333"/>
  <text x="52" y="111" font-size="11">Interceptor Global (@RestControllerAdvice)</text>
  <rect x="30" y="119" width="16" height="12" fill="#f8d7da" stroke="#c0392b"/>
  <text x="52" y="129" font-size="11">Excepción / Respuesta HTTP de Error (JSON)</text>

  <!-- 1. Cliente HTTP -->
  <rect x="330" y="50" width="300" height="60" rx="6" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="68" text-anchor="middle" font-size="11" fill="#444">«cliente / front-end»</text>
  <text x="480" y="86" text-anchor="middle" font-size="13" font-weight="bold">Navegador / Postman / Swagger UI</text>

  <!-- Flecha 1: Petición HTTP -->
  <line x1="450" y1="110" x2="450" y2="155" stroke="#222" stroke-width="1.5" marker-end="url(#filled)"/>
  <rect x="345" y="122" width="100" height="16" fill="white" fill-opacity="0.95"/>
  <text x="440" y="134" text-anchor="end" font-size="10.5" fill="#111">GET /petshop/pet/99</text>

  <!-- 2. PetController -->
  <rect x="330" y="155" width="300" height="65" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="173" text-anchor="middle" font-size="11" fill="#444">«controlador REST»</text>
  <text x="480" y="191" text-anchor="middle" font-size="13" font-weight="bold">PetController</text>
  <text x="480" y="207" text-anchor="middle" font-size="10.5" fill="#555">invoca petService.findById(99)</text>

  <!-- Flecha 2: Llamada a servicio -->
  <line x1="480" y1="220" x2="480" y2="265" stroke="#222" stroke-width="1.5" marker-end="url(#filled)"/>
  <text x="488" y="246" text-anchor="start" font-size="10.5" fill="#111">llama a</text>

  <!-- 3. PetService -->
  <rect x="330" y="265" width="300" height="75" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="283" text-anchor="middle" font-size="11" fill="#444">«capa de servicio»</text>
  <text x="480" y="301" text-anchor="middle" font-size="13" font-weight="bold">PetServiceImpl</text>
  <text x="480" y="318" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="bold">No existe ID 99 → ¡Lanza PetNotFoundException!</text>

  <!-- Flecha 3: Salto de excepción a ControllerAdvice -->
  <path d="M 630 302 Q 780 302 780 410 Q 780 470 630 470" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#error-arrow)"/>
  <rect x="690" y="375" width="170" height="28" rx="4" fill="#f8d7da" stroke="#c0392b"/>
  <text x="775" y="393" text-anchor="middle" font-size="10.5" fill="#900" font-weight="bold">Intercepción automática</text>

  <!-- 4. RestControllerAdvice -->
  <rect x="270" y="420" width="360" height="100" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="450" y="438" text-anchor="middle" font-size="11" fill="#2d6a4f">«interceptor global de excepciones»</text>
  <text x="450" y="456" text-anchor="middle" font-size="14" font-weight="bold">GlobalExceptionHandler (@RestControllerAdvice)</text>
  <line x1="270" y1="464" x2="630" y2="464" stroke="#28a745" stroke-width="1"/>
  <text x="450" y="480" text-anchor="middle" font-size="11">@ExceptionHandler(PetNotFoundException.class)</text>
  <text x="450" y="496" text-anchor="middle" font-size="10.5" fill="#444">Mapea a HttpStatus.NOT_FOUND (404) y crea ErrorResponseDTO</text>
  <text x="450" y="511" text-anchor="middle" font-size="10" fill="#666">Registra log con SLF4J (log.warn(...)) sin fugar stacktrace</text>

  <!-- Flecha 4: Respuesta JSON 404 al cliente -->
  <path d="M 270 470 Q 150 470 150 190 Q 150 80 325 80" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#error-arrow)"/>
  <rect x="50" y="270" width="200" height="60" rx="5" fill="#f8d7da" stroke="#c0392b" stroke-width="1.2"/>
  <text x="150" y="287" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#900">HTTP 404 Not Found (JSON)</text>
  <text x="150" y="303" text-anchor="middle" font-size="9.5" fill="#333">status: 404</text>
  <text x="150" y="318" text-anchor="middle" font-size="9.5" fill="#333">message: "Mascota 99 no hallada"</text>

  <!-- Pie con resumen del flujo -->
  <rect x="230" y="580" width="500" height="50" rx="6" fill="#f8f9fa" stroke="#ccc"/>
  <text x="480" y="600" text-anchor="middle" font-size="11" font-weight="bold">Controlador y Servicio quedan 100% limpios de bloques try-catch</text>
  <text x="480" y="618" text-anchor="middle" font-size="10.5" fill="#555">El cliente siempre recibe un contrato JSON de error consistente y estandarizado</text>
</svg>