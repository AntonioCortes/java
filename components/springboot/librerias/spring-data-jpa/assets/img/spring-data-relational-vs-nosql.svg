<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="980" height="620" fill="white"/>
  <defs>
    <marker id="m-sql" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2980b9"/></marker>
    <marker id="m-nosql" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#27ae60"/></marker>
  </defs>

  <text x="490" y="24" text-anchor="middle" font-size="16" font-weight="bold">Arquitectura Spring Data: Persistencia Relacional (JPA) vs NoSQL Documental (MongoDB)</text>

  <!-- Capa Común: Repositorio Spring Data -->
  <rect x="290" y="55" width="400" height="75" rx="6" fill="#e8f4f8" stroke="#0288d1" stroke-width="2"/>
  <text x="490" y="78" text-anchor="middle" font-size="11" fill="#0277bd">«abstracción superior compartida»</text>
  <text x="490" y="98" text-anchor="middle" font-size="15" font-weight="bold">Spring Data Commons: Repository&lt;T, ID&gt;</text>
  <text x="490" y="116" text-anchor="middle" font-size="10.5" fill="#555">CrudRepository, PagingAndSortingRepository, Query Methods</text>

  <!-- LADO IZQUIERDO: RELACIONAL (JPA / PostgreSQL / Oracle) -->
  <rect x="30" y="170" width="440" height="380" rx="8" fill="#f4f8fb" stroke="#2980b9" stroke-width="2"/>
  <text x="250" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4f72">1. Rama Relacional: Spring Data JPA</text>
  <line x1="30" y1="205" x2="470" y2="205" stroke="#2980b9" stroke-width="1"/>

  <rect x="50" y="215" width="400" height="55" rx="4" fill="white" stroke="#2980b9"/>
  <text x="250" y="235" text-anchor="middle" font-size="11" font-weight="bold">JpaRepository&lt;Pet, Integer&gt;</text>
  <text x="250" y="253" text-anchor="middle" font-size="10" fill="#555">Motor ORM: Hibernate / EclipseLink</text>

  <rect x="50" y="280" width="400" height="90" rx="4" fill="white" stroke="#2980b9"/>
  <text x="250" y="300" text-anchor="middle" font-size="11" font-weight="bold">Modelo de Datos Normalizado</text>
  <text x="250" y="318" text-anchor="middle" font-size="10">@Entity, @Table(name = "pets")</text>
  <text x="250" y="334" text-anchor="middle" font-size="10">Relaciones con FK: @ManyToOne, @OneToMany</text>
  <text x="250" y="350" text-anchor="middle" font-size="10">Consultas: JPQL y SQL Nativo</text>

  <rect x="50" y="380" width="190" height="100" rx="4" fill="#e1f5fe" stroke="#0288d1"/>
  <text x="145" y="400" text-anchor="middle" font-size="11" font-weight="bold">PostgreSQL</text>
  <text x="145" y="420" text-anchor="middle" font-size="9.5">ID: IDENTITY / BIGSERIAL</text>
  <text x="145" y="440" text-anchor="middle" font-size="9.5">Tipo nativo BOOLEAN</text>
  <text x="145" y="460" text-anchor="middle" font-size="9.5">Paginación: LIMIT / OFFSET</text>

  <rect x="260" y="380" width="190" height="100" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="355" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">Oracle Database</text>
  <text x="355" y="420" text-anchor="middle" font-size="9.5">ID: @SequenceGenerator</text>
  <text x="355" y="440" text-anchor="middle" font-size="9.5">Sin boolean: Converter a CHAR(1)</text>
  <text x="355" y="460" text-anchor="middle" font-size="9.5">Paginación: FETCH FIRST ROWS</text>

  <rect x="50" y="495" width="400" height="40" rx="4" fill="#e8eaf6" stroke="#3f51b5"/>
  <text x="250" y="520" text-anchor="middle" font-size="10.5" font-weight="bold">Transacciones ACID estrictas con bloqueo pesimista y optimista</text>

  <!-- LADO DERECHO: NOSQL DOCUMENTAL (MongoDB) -->
  <rect x="510" y="170" width="440" height="380" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="2"/>
  <text x="730" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#196f3d">2. Rama NoSQL Documental: Spring Data MongoDB</text>
  <line x1="510" y1="205" x2="950" y2="205" stroke="#27ae60" stroke-width="1"/>

  <rect x="530" y="215" width="400" height="55" rx="4" fill="white" stroke="#27ae60"/>
  <text x="730" y="235" text-anchor="middle" font-size="11" font-weight="bold">MongoRepository&lt;PetDocument, String&gt;</text>
  <text x="730" y="253" text-anchor="middle" font-size="10" fill="#555">Driver BSON / MongoTemplate</text>

  <rect x="530" y="280" width="400" height="90" rx="4" fill="white" stroke="#27ae60"/>
  <text x="730" y="300" text-anchor="middle" font-size="11" font-weight="bold">Modelo de Documentos JSON/BSON</text>
  <text x="730" y="318" text-anchor="middle" font-size="10">@Document(collection = "pets")</text>
  <text x="730" y="334" text-anchor="middle" font-size="10">Subdocumentos embebidos (sin joins ni FK)</text>
  <text x="730" y="350" text-anchor="middle" font-size="10">Consultas: Filtros JSON/BSON con @Query</text>

  <rect x="530" y="380" width="400" height="100" rx="4" fill="#e8f8f0" stroke="#27ae60"/>
  <text x="730" y="400" text-anchor="middle" font-size="11" font-weight="bold">MongoDB</text>
  <text x="730" y="420" text-anchor="middle" font-size="9.5">ID: @MongoId / String ObjectId (12 bytes hexadecimal)</text>
  <text x="730" y="440" text-anchor="middle" font-size="9.5">Tipos flexibles: Arrays, subobjetos, geoespaciales</text>
  <text x="730" y="460" text-anchor="middle" font-size="9.5">Paginación: Skip / Limit en cursor BSON</text>

  <rect x="530" y="495" width="400" height="40" rx="4" fill="#e8f8f0" stroke="#27ae60"/>
  <text x="730" y="520" text-anchor="middle" font-size="10.5" font-weight="bold">Esquema flexible, escalado horizontal (Sharding) y alta velocidad</text>

  <!-- Flechas hacia las dos ramas -->
  <path d="M 410 130 L 410 150 L 250 150 L 250 165" fill="none" stroke="#2980b9" stroke-width="2" marker-end="url(#m-sql)"/>
  <path d="M 570 130 L 570 150 L 730 150 L 730 165" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#m-nosql)"/>

  <rect x="190" y="570" width="600" height="36" rx="5" fill="#f8f9fa" stroke="#ccc"/>
  <text x="490" y="593" text-anchor="middle" font-size="11" font-weight="bold">Misma API de métodos derivados en Java para bases de datos relacionales y NoSQL</text>
</svg>