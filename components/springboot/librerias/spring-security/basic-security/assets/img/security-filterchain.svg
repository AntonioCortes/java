<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="560" fill="white"/>
  <defs>
    <marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="m6-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker>
  </defs>
  <text x="480" y="24" text-anchor="middle" font-size="16" font-weight="bold">Arquitectura de Cadena de Filtros en Spring Security 6</text>

  <!-- Petición Entrante -->
  <rect x="30" y="210" width="130" height="60" rx="5" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="95" y="235" text-anchor="middle" font-size="11" fill="#444">«petición HTTP»</text>
  <text x="95" y="255" text-anchor="middle" font-size="12" font-weight="bold">Cliente REST</text>

  <line x1="160" y1="240" x2="210" y2="240" stroke="#222" stroke-width="2" marker-end="url(#m6)"/>

  <!-- DelegatingFilterProxy & FilterChainProxy -->
  <rect x="215" y="140" width="530" height="260" rx="8" fill="#f8f9fa" stroke="#1971c2" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="480" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">SecurityFilterChain (@Bean en ApplicationSecurityConfig)</text>

  <!-- Filtro 1: CorsFilter -->
  <rect x="235" y="190" width="115" height="100" rx="4" fill="#d0ebff" stroke="#1971c2"/>
  <text x="292" y="210" text-anchor="middle" font-size="10" fill="#1864ab">«filtro»</text>
  <text x="292" y="228" text-anchor="middle" font-size="11" font-weight="bold">CorsFilter</text>
  <line x1="235" y1="235" x2="350" y2="235" stroke="#1971c2" stroke-width="1"/>
  <text x="292" y="255" text-anchor="middle" font-size="9.5">Valida cabeceras</text>
  <text x="292" y="270" text-anchor="middle" font-size="9.5">Origin / Methods</text>

  <!-- Filtro 2: CsrfFilter -->
  <rect x="365" y="190" width="115" height="100" rx="4" fill="#d0ebff" stroke="#1971c2"/>
  <text x="422" y="210" text-anchor="middle" font-size="10" fill="#1864ab">«filtro»</text>
  <text x="422" y="228" text-anchor="middle" font-size="11" font-weight="bold">CsrfFilter</text>
  <line x1="365" y1="235" x2="480" y2="235" stroke="#1971c2" stroke-width="1"/>
  <text x="422" y="255" text-anchor="middle" font-size="9.5">Disabled para</text>
  <text x="422" y="270" text-anchor="middle" font-size="9.5">APIs REST</text>

  <!-- Filtro 3: AuthFilter -->
  <rect x="495" y="190" width="115" height="100" rx="4" fill="#fff3c4" stroke="#e67e22"/>
  <text x="552" y="210" text-anchor="middle" font-size="10" fill="#d35400">«autenticación»</text>
  <text x="552" y="228" text-anchor="middle" font-size="11" font-weight="bold">Basic / Bearer</text>
  <line x1="495" y1="235" x2="610" y2="235" stroke="#e67e22" stroke-width="1"/>
  <text x="552" y="255" text-anchor="middle" font-size="9.5">Valida credencial</text>
  <text x="552" y="270" text-anchor="middle" font-size="9.5">SecurityContext</text>

  <!-- Filtro 4: AuthorizationFilter -->
  <rect x="625" y="190" width="105" height="100" rx="4" fill="#d4edda" stroke="#28a745"/>
  <text x="677" y="210" text-anchor="middle" font-size="10" fill="#2d6a4f">«autorización»</text>
  <text x="677" y="228" text-anchor="middle" font-size="11" font-weight="bold">AuthFilter</text>
  <line x1="625" y1="235" x2="730" y2="235" stroke="#28a745" stroke-width="1"/>
  <text x="677" y="255" text-anchor="middle" font-size="9.5">hasRole(ADMIN)</text>
  <text x="677" y="270" text-anchor="middle" font-size="9.5">permitAll()</text>

  <!-- Flechas entre filtros -->
  <line x1="350" y1="240" x2="365" y2="240" stroke="#222" stroke-width="1.5"/>
  <line x1="480" y1="240" x2="495" y2="240" stroke="#222" stroke-width="1.5"/>
  <line x1="610" y1="240" x2="625" y2="240" stroke="#222" stroke-width="1.5"/>

  <!-- Destino: DispatcherServlet o Bloqueo -->
  <line x1="730" y1="240" x2="795" y2="240" stroke="#27ae60" stroke-width="2" marker-end="url(#m6)"/>
  <rect x="800" y="210" width="140" height="60" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="870" y="235" text-anchor="middle" font-size="11" fill="#2d6a4f">«controlador REST»</text>
  <text x="870" y="255" text-anchor="middle" font-size="12" font-weight="bold">PetController (200)</text>

  <!-- Rechazo 401 / 403 -->
  <path d="M 552 290 L 552 460 L 800 460" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#m6-deny)"/>
  <rect x="800" y="430" width="140" height="60" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="2"/>
  <text x="870" y="455" text-anchor="middle" font-size="11" fill="#900">«error de acceso»</text>
  <text x="870" y="475" text-anchor="middle" font-size="12" font-weight="bold">401 Unauth / 403</text>
</svg>