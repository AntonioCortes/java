<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="560" fill="white"/>
  <defs>
    <marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="m5-zip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#099268"/></marker>
  </defs>
  <text x="480" y="24" text-anchor="middle" font-size="16" font-weight="bold">Trazabilidad Distribuida: Micrometer Tracing y Zipkin</text>

  <!-- Microservicio A: Gateway -->
  <rect x="30" y="100" width="260" height="130" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="1.8"/>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#1864ab">«microservicio 1: punto de entrada»</text>
  <text x="160" y="142" text-anchor="middle" font-size="13" font-weight="bold">API Gateway</text>
  <line x1="30" y1="150" x2="290" y2="150" stroke="#1971c2" stroke-width="1"/>
  <text x="160" y="170" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="bold">TraceId: a1b2c3d4 (Global)</text>
  <text x="160" y="190" text-anchor="middle" font-size="10.5">SpanId: 1001 (Gateway span)</text>
  <text x="160" y="210" text-anchor="middle" font-size="10">Inyecta cabecera traceparent W3C</text>

  <!-- Microservicio B: Order -->
  <rect x="350" y="100" width="260" height="130" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.8"/>
  <text x="480" y="122" text-anchor="middle" font-size="11" fill="#444">«microservicio 2: orquestador»</text>
  <text x="480" y="142" text-anchor="middle" font-size="13" font-weight="bold">Order-Service</text>
  <line x1="350" y1="150" x2="610" y2="150" stroke="#333" stroke-width="1"/>
  <text x="480" y="170" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="bold">TraceId: a1b2c3d4 (Idéntico)</text>
  <text x="480" y="190" text-anchor="middle" font-size="10.5">SpanId: 2002 (Order span)</text>
  <text x="480" y="210" text-anchor="middle" font-size="10">ParentId: 1001</text>

  <!-- Microservicio C: Pet -->
  <rect x="670" y="100" width="260" height="130" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.8"/>
  <text x="800" y="122" text-anchor="middle" font-size="11" fill="#444">«microservicio 3: persistencia»</text>
  <text x="800" y="142" text-anchor="middle" font-size="13" font-weight="bold">Pet-Service</text>
  <line x1="670" y1="150" x2="930" y2="150" stroke="#333" stroke-width="1"/>
  <text x="800" y="170" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="bold">TraceId: a1b2c3d4 (Idéntico)</text>
  <text x="800" y="190" text-anchor="middle" font-size="10.5">SpanId: 3003 (Pet span)</text>
  <text x="800" y="210" text-anchor="middle" font-size="10">ParentId: 2002</text>

  <!-- Flechas entre microservicios -->
  <line x1="290" y1="165" x2="345" y2="165" stroke="#222" stroke-width="2" marker-end="url(#m5)"/>
  <text x="317" y="155" text-anchor="middle" font-size="9">HTTP</text>
  <line x1="610" y1="165" x2="665" y2="165" stroke="#222" stroke-width="2" marker-end="url(#m5)"/>
  <text x="637" y="155" text-anchor="middle" font-size="9">Feign</text>

  <!-- Servidor Zipkin UI -->
  <rect x="250" y="320" width="460" height="180" rx="8" fill="#e6fcf5" stroke="#099268" stroke-width="2"/>
  <text x="480" y="345" text-anchor="middle" font-size="12" fill="#087f5b">«servidor de visualización y análisis»</text>
  <text x="480" y="365" text-anchor="middle" font-size="15" font-weight="bold">Zipkin Server (Puerto 9411)</text>
  <line x1="250" y1="373" x2="710" y2="373" stroke="#099268" stroke-width="1"/>
  <rect x="280" y="390" width="380" height="20" rx="3" fill="#d0ebff"/>
  <text x="470" y="404" text-anchor="middle" font-size="10">Gateway Span: 120ms</text>
  <rect x="330" y="420" width="300" height="20" rx="3" fill="#fff3c4"/>
  <text x="470" y="434" text-anchor="middle" font-size="10">Order-Service Span: 90ms</text>
  <rect x="420" y="450" width="180" height="20" rx="3" fill="#ffe5cc"/>
  <text x="510" y="464" text-anchor="middle" font-size="10">Pet-Service Span: 45ms</text>

  <!-- Flechas hacia Zipkin -->
  <path d="M 160 230 L 160 380 L 245 380" fill="none" stroke="#099268" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m5-zip)"/>
  <path d="M 480 230 L 480 315" fill="none" stroke="#099268" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m5-zip)"/>
  <path d="M 800 230 L 800 380 L 715 380" fill="none" stroke="#099268" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m5-zip)"/>
</svg>