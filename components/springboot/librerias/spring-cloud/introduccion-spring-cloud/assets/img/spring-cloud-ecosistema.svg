<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="980" height="640" fill="white"/>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="m-cloud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2980b9"/></marker>
  </defs>
  <text x="490" y="24" text-anchor="middle" font-size="16" font-weight="bold">Arquitectura Global del Ecosistema Spring Cloud</text>
  <text x="25" y="55" font-size="12" font-weight="bold">Leyenda</text>
  <rect x="25" y="65" width="16" height="12" fill="#e8e8e8" stroke="#333"/><text x="47" y="75" font-size="11">Clientes externos</text>
  <rect x="25" y="83" width="16" height="12" fill="#d0ebff" stroke="#1971c2"/><text x="47" y="93" font-size="11">Infraestructura Cloud (Gateway, Eureka, Config)</text>
  <rect x="25" y="101" width="16" height="12" fill="#fff3c4" stroke="#333"/><text x="47" y="111" font-size="11">Microservicios de Negocio (Pet, Customer, Orders)</text>
  <rect x="25" y="119" width="16" height="12" fill="#e6fcf5" stroke="#099268"/><text x="47" y="129" font-size="11">Observabilidad y Telemetría (Zipkin, Tracing)</text>

  <!-- Cliente -->
  <rect x="25" y="260" width="150" height="70" rx="6" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="285" text-anchor="middle" font-size="11" fill="#444">«cliente externo»</text>
  <text x="100" y="305" text-anchor="middle" font-size="12" font-weight="bold">App Móvil / SPA</text>

  <!-- Flecha Cliente -> Gateway -->
  <line x1="175" y1="295" x2="230" y2="295" stroke="#222" stroke-width="2" marker-end="url(#m1)"/>
  <text x="202" y="285" text-anchor="middle" font-size="10">HTTPS / REST</text>

  <!-- API Gateway -->
  <rect x="230" y="235" width="180" height="120" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="#1864ab">«API Gateway reactivo»</text>
  <text x="320" y="275" text-anchor="middle" font-size="13" font-weight="bold">Spring Cloud Gateway</text>
  <line x1="230" y1="283" x2="410" y2="283" stroke="#1971c2" stroke-width="1"/>
  <text x="320" y="300" text-anchor="middle" font-size="10.5">Enrutamiento dinámico</text>
  <text x="320" y="316" text-anchor="middle" font-size="10.5">Rate Limiting &amp; Seguridad</text>
  <text x="320" y="332" text-anchor="middle" font-size="10.5">Filtros de cabeceras</text>

  <!-- Eureka Server -->
  <rect x="490" y="55" width="220" height="110" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="600" y="75" text-anchor="middle" font-size="11" fill="#1864ab">«servidor de descubrimiento»</text>
  <text x="600" y="95" text-anchor="middle" font-size="14" font-weight="bold">Netflix Eureka Server</text>
  <line x1="490" y1="103" x2="710" y2="103" stroke="#1971c2" stroke-width="1"/>
  <text x="600" y="120" text-anchor="middle" font-size="10.5">Registro dinámico de instancias</text>
  <text x="600" y="136" text-anchor="middle" font-size="10.5">Monitor de salud (Heartbeat)</text>
  <text x="600" y="152" text-anchor="middle" font-size="10.5">Catálogo de microservicios</text>

  <!-- Microservicio 1: Pet-Service -->
  <rect x="490" y="225" width="220" height="100" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.8"/>
  <text x="600" y="245" text-anchor="middle" font-size="11" fill="#444">«microservicio REST»</text>
  <text x="600" y="265" text-anchor="middle" font-size="13" font-weight="bold">Pet-Service (Instancia 1, 2)</text>
  <line x1="490" y1="273" x2="710" y2="273" stroke="#333" stroke-width="1"/>
  <text x="600" y="290" text-anchor="middle" font-size="10">Spring Data JPA + PostgreSQL</text>
  <text x="600" y="306" text-anchor="middle" font-size="10">OpenFeign (Llamadas remotas)</text>

  <!-- Microservicio 2: Order-Service -->
  <rect x="490" y="365" width="220" height="100" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.8"/>
  <text x="600" y="385" text-anchor="middle" font-size="11" fill="#444">«microservicio REST»</text>
  <text x="600" y="405" text-anchor="middle" font-size="13" font-weight="bold">Order-Service</text>
  <line x1="490" y1="413" x2="710" y2="413" stroke="#333" stroke-width="1"/>
  <text x="600" y="430" text-anchor="middle" font-size="10">Resilience4j Circuit Breaker</text>
  <text x="600" y="446" text-anchor="middle" font-size="10">RabbitMQ Producer</text>

  <!-- Zipkin Tracing -->
  <rect x="490" y="505" width="220" height="90" rx="6" fill="#e6fcf5" stroke="#099268" stroke-width="1.8"/>
  <text x="600" y="525" text-anchor="middle" font-size="11" fill="#087f5b">«servidor de telemetría»</text>
  <text x="600" y="545" text-anchor="middle" font-size="13" font-weight="bold">Zipkin Tracing Server</text>
  <line x1="490" y1="553" x2="710" y2="553" stroke="#099268" stroke-width="1"/>
  <text x="600" y="570" text-anchor="middle" font-size="10.5">Micrometer Tracing (TraceId / SpanId)</text>
  <text x="600" y="586" text-anchor="middle" font-size="10.5">Trazabilidad de latencia end-to-end</text>

  <!-- Flechas Gateway -> Microservicios -->
  <path d="M 410 275 L 485 275" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#m1)"/>
  <text x="447" y="267" text-anchor="middle" font-size="9.5">lb://PET</text>
  <path d="M 410 315 L 450 315 L 450 415 L 485 415" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#m1)"/>
  <text x="447" y="407" text-anchor="middle" font-size="9.5">lb://ORDER</text>

  <!-- Flechas Microservicios <-> Eureka -->
  <path d="M 600 225 L 600 170" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m-cloud)"/>
  <text x="660" y="195" text-anchor="middle" font-size="9.5" fill="#1864ab">Heartbeat &amp; Registro</text>
  <path d="M 320 235 L 320 110 L 485 110" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m-cloud)"/>
  <text x="400" y="102" text-anchor="middle" font-size="9.5" fill="#1864ab">Consulta rutas</text>

  <!-- Comunicación Feign entre Pet y Order -->
  <path d="M 710 275 Q 820 340 710 415" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#m1)"/>
  <rect x="735" y="335" width="140" height="24" rx="4" fill="#fef5e7" stroke="#e67e22"/>
  <text x="805" y="351" text-anchor="middle" font-size="10" fill="#d35400" font-weight="bold">OpenFeign (@FeignClient)</text>

  <!-- Trazabilidad hacia Zipkin -->
  <path d="M 710 445 L 800 445 L 800 550 L 715 550" fill="none" stroke="#099268" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#m1)"/>
  <text x="840" y="500" text-anchor="middle" font-size="9.5" fill="#087f5b">Spans HTTP</text>
</svg>