<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="580" fill="white"/>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1971c2"/></marker>
  </defs>
  <text x="480" y="24" text-anchor="middle" font-size="16" font-weight="bold">Descubrimiento Dinámico de Servicios con Netflix Eureka</text>

  <!-- Eureka Server -->
  <rect x="330" y="60" width="300" height="120" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="480" y="85" text-anchor="middle" font-size="12" fill="#1864ab">«servidor de catálogo / Service Registry»</text>
  <text x="480" y="105" text-anchor="middle" font-size="15" font-weight="bold">Eureka Server (@EnableEurekaServer)</text>
  <line x1="330" y1="113" x2="630" y2="113" stroke="#1971c2" stroke-width="1"/>
  <text x="480" y="130" text-anchor="middle" font-size="11">Tabla de Instancias Vivas en Memoria:</text>
  <text x="480" y="146" text-anchor="middle" font-size="10.5" fill="#333">PET-SERVICE → [192.168.1.10:8081, 192.168.1.11:8082]</text>
  <text x="480" y="162" text-anchor="middle" font-size="10.5" fill="#333">ORDER-SERVICE → [192.168.1.20:8090]</text>

  <!-- Cliente Emisor / Consumidor -->
  <rect x="80" y="320" width="280" height="130" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.8"/>
  <text x="220" y="342" text-anchor="middle" font-size="11" fill="#444">«microservicio consumidor»</text>
  <text x="220" y="362" text-anchor="middle" font-size="14" font-weight="bold">Order-Service (@EnableDiscoveryClient)</text>
  <line x1="80" y1="370" x2="360" y2="370" stroke="#333" stroke-width="1"/>
  <text x="220" y="388" text-anchor="middle" font-size="11">1. Auto-registro al arrancar</text>
  <text x="220" y="405" text-anchor="middle" font-size="11">2. Heartbeat cada 30 segundos</text>
  <text x="220" y="422" text-anchor="middle" font-size="11">3. Descarga catálogo local de instancias</text>
  <text x="220" y="439" text-anchor="middle" font-size="11">4. Invoca por nombre lógico con Feign</text>

  <!-- Proveedor de Servicio: Instancias Pet-Service -->
  <rect x="600" y="270" width="280" height="90" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.8"/>
  <text x="740" y="290" text-anchor="middle" font-size="11" fill="#444">«instancia A»</text>
  <text x="740" y="310" text-anchor="middle" font-size="13" font-weight="bold">Pet-Service (Puerto 8081)</text>
  <text x="740" y="328" text-anchor="middle" font-size="10.5" fill="#555">IP: 192.168.1.10 - Estado: UP</text>
  <text x="740" y="344" text-anchor="middle" font-size="10" fill="#27ae60">Renueva lease (Heartbeat OK)</text>

  <rect x="600" y="390" width="280" height="90" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.8"/>
  <text x="740" y="410" text-anchor="middle" font-size="11" fill="#444">«instancia B (réplica)»</text>
  <text x="740" y="430" text-anchor="middle" font-size="13" font-weight="bold">Pet-Service (Puerto 8082)</text>
  <text x="740" y="448" text-anchor="middle" font-size="10.5" fill="#555">IP: 192.168.1.11 - Estado: UP</text>
  <text x="740" y="464" text-anchor="middle" font-size="10" fill="#27ae60">Renueva lease (Heartbeat OK)</text>

  <!-- Flechas Registro de Pet-Service hacia Eureka -->
  <path d="M 600 300 L 490 300 L 490 185" fill="none" stroke="#1971c2" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#me)"/>
  <text x="535" y="240" text-anchor="middle" font-size="10" fill="#1864ab">Registro y Heartbeat</text>

  <!-- Flechas Consulta de Order-Service a Eureka -->
  <path d="M 240 320 L 240 140 L 325 140" fill="none" stroke="#1971c2" stroke-width="1.8" marker-end="url(#me)"/>
  <rect x="180" y="200" width="130" height="20" rx="3" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="245" y="214" text-anchor="middle" font-size="10" fill="#1864ab">Descarga lista IPs</text>

  <!-- Llamada balanceada directa Order -> Pet -->
  <line x1="360" y1="385" x2="595" y2="385" stroke="#222" stroke-width="2" marker-end="url(#m2)"/>
  <rect x="420" y="365" width="130" height="38" rx="4" fill="#f8f9fa" stroke="#333"/>
  <text x="485" y="380" text-anchor="middle" font-size="10" font-weight="bold">Llamada REST directa</text>
  <text x="485" y="395" text-anchor="middle" font-size="9" fill="#555">Balanceo Round-Robin</text>

  <rect x="230" y="520" width="500" height="40" rx="6" fill="#f8f9fa" stroke="#ccc"/>
  <text x="480" y="545" text-anchor="middle" font-size="11" font-weight="bold">Eureka nunca actúa de proxy de datos: el tráfico HTTP viaja directo entre microservicios</text>
</svg>