<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="560" fill="white"/>
  <defs>
    <marker id="m10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="m10-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker>
    <marker id="m10-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#27ae60"/></marker>
  </defs>
  <text x="480" y="24" text-anchor="middle" font-size="16" font-weight="bold">Máquina de Estados de Resilience4j Circuit Breaker</text>

  <!-- Estado CLOSED (Normal) -->
  <rect x="60" y="160" width="240" height="150" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="180" y="185" text-anchor="middle" font-size="12" fill="#2d6a4f">«estado normal»</text>
  <text x="180" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#155724">CERRADO (Closed)</text>
  <line x1="60" y1="220" x2="300" y2="220" stroke="#28a745" stroke-width="1"/>
  <text x="180" y="240" text-anchor="middle" font-size="11">El tráfico pasa normalmente</text>
  <text x="180" y="260" text-anchor="middle" font-size="11">Mide tasa de errores (% fallos)</text>
  <text x="180" y="280" text-anchor="middle" font-size="11">Ventana deslizante (ej. 100 reqs)</text>

  <!-- Estado OPEN (Abierto / Fallando) -->
  <rect x="660" y="160" width="240" height="150" rx="8" fill="#f8d7da" stroke="#c0392b" stroke-width="2"/>
  <text x="780" y="185" text-anchor="middle" font-size="12" fill="#900">«estado de aislamiento»</text>
  <text x="780" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#721c24">ABIERTO (Open)</text>
  <line x1="660" y1="220" x2="900" y2="220" stroke="#c0392b" stroke-width="1"/>
  <text x="780" y="240" text-anchor="middle" font-size="11" font-weight="bold">El circuito se abre (falla rápido)</text>
  <text x="780" y="260" text-anchor="middle" font-size="11">NO se llama al servicio remoto</text>
  <text x="780" y="280" text-anchor="middle" font-size="11">Ejecuta método Fallback</text>

  <!-- Estado HALF-OPEN (Semi-abierto / Comprobando) -->
  <rect x="360" y="360" width="240" height="150" rx="8" fill="#fff3c4" stroke="#e67e22" stroke-width="2"/>
  <text x="480" y="385" text-anchor="middle" font-size="12" fill="#d35400">«estado de prueba»</text>
  <text x="480" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#856404">SEMI-ABIERTO (Half-Open)</text>
  <line x1="360" y1="420" x2="600" y2="420" stroke="#e67e22" stroke-width="1"/>
  <text x="480" y="440" text-anchor="middle" font-size="11">Tras waitDurationInOpenState (ej. 10s)</text>
  <text x="480" y="460" text-anchor="middle" font-size="11">Deja pasar número limitado de llamadas</text>
  <text x="480" y="480" text-anchor="middle" font-size="11">Verifica si el servicio se recuperó</text>

  <!-- Transición Closed -> Open -->
  <path d="M 300 200 L 655 200" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#m10-err)"/>
  <text x="480" y="190" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="bold">Tasa de fallo &gt; umbral (ej. 50%)</text>

  <!-- Transición Open -> Half-Open -->
  <path d="M 780 310 L 780 435 L 605 435" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#m10)"/>
  <text x="710" y="420" text-anchor="middle" font-size="10.5" fill="#e67e22">Tiempo de espera expirado</text>

  <!-- Transición Half-Open -> Closed -->
  <path d="M 360 435 L 180 435 L 180 315" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#m10-ok)"/>
  <text x="250" y="420" text-anchor="middle" font-size="10.5" fill="#27ae60" font-weight="bold">Llamadas de prueba exitosas</text>

  <!-- Transición Half-Open -> Open (Vuelve a fallar) -->
  <path d="M 580 360 L 680 300" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#m10-err)"/>
  <text x="660" y="345" text-anchor="middle" font-size="10" fill="#c0392b">Vuelve a fallar</text>
</svg>