<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Arial, Helvetica, sans-serif"><rect width="960" height="440" fill="white"/><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.5"/></marker><marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="white" stroke="#222" stroke-width="1.5"/></marker><marker id="filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker></defs><text x="480.0" y="22" text-anchor="middle" font-size="16" font-weight="bold">Flyway: funcionamiento al arrancar la aplicación</text><rect x="20" y="140" width="210" height="100" rx="6" fill="#fff3c4" stroke="#333" stroke-width="1.5"/><text x="125.0" y="158" text-anchor="middle" font-size="11" fill="#444">«aplicación Spring Boot»</text><text x="125.0" y="176" text-anchor="middle" font-size="14" font-weight="bold">PetShop</text><line x1="20" y1="182" x2="230" y2="182" stroke="#333" stroke-width="1"/><text x="125.0" y="198" text-anchor="middle" font-size="11.5">Arranca el contexto</text><text x="125.0" y="214" text-anchor="middle" font-size="11.5">spring.flyway.enabled=true</text><rect x="320" y="140" width="200" height="100" rx="6" fill="#ffd9b3" stroke="#333" stroke-width="1.5"/><text x="420.0" y="158" text-anchor="middle" font-size="11" fill="#444">«librería de migraciones»</text><text x="420.0" y="176" text-anchor="middle" font-size="14" font-weight="bold">Flyway</text><line x1="320" y1="182" x2="520" y2="182" stroke="#333" stroke-width="1"/><text x="420.0" y="198" text-anchor="middle" font-size="11.5">Ordena por versión</text><text x="420.0" y="214" text-anchor="middle" font-size="11.5">Valida el checksum</text><rect x="310" y="310" width="220" height="100" rx="6" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/><text x="420.0" y="328" text-anchor="middle" font-size="11" fill="#444">«carpeta de scripts SQL»</text><text x="420.0" y="346" text-anchor="middle" font-size="14" font-weight="bold">db/migration</text><line x1="310" y1="352" x2="530" y2="352" stroke="#333" stroke-width="1"/><text x="420.0" y="368" text-anchor="middle" font-size="11.5">V1__create_pet_table.sql</text><text x="420.0" y="384" text-anchor="middle" font-size="11.5">V2__insert_initial_pets.sql</text><rect x="650" y="140" width="270" height="100" rx="6" fill="#d5f5d5" stroke="#333" stroke-width="1.5"/><text x="785.0" y="158" text-anchor="middle" font-size="11" fill="#444">«base de datos»</text><text x="785.0" y="176" text-anchor="middle" font-size="14" font-weight="bold">PostgreSQL</text><line x1="650" y1="182" x2="920" y2="182" stroke="#333" stroke-width="1"/><text x="785.0" y="198" text-anchor="middle" font-size="11.5">tabla pet (esquema de la app)</text><rect x="650" y="310" width="270" height="100" rx="6" fill="#d5f5d5" stroke="#333" stroke-width="1.5"/><text x="785.0" y="328" text-anchor="middle" font-size="11" fill="#444">«tabla de control»</text><text x="785.0" y="346" text-anchor="middle" font-size="14" font-weight="bold">flyway_schema_history</text><line x1="650" y1="352" x2="920" y2="352" stroke="#333" stroke-width="1"/><text x="785.0" y="368" text-anchor="middle" font-size="11.5">versión, descripción, checksum,</text><text x="785.0" y="384" text-anchor="middle" font-size="11.5">fecha de instalación, éxito</text><rect x="650" y="40" width="270" height="70" rx="6" fill="#ffd9b3" stroke="#333" stroke-width="1.5"/><text x="785.0" y="58" text-anchor="middle" font-size="11" fill="#444">«ORM»</text><text x="785.0" y="76" text-anchor="middle" font-size="14" font-weight="bold">Hibernate (ddl-auto: validate)</text><line x1="650" y1="82" x2="920" y2="82" stroke="#333" stroke-width="1"/><text x="785.0" y="98" text-anchor="middle" font-size="11.5">Solo valida, no modifica</text><line x1="230" y1="190" x2="320" y2="190" stroke="#222" stroke-width="1.5" marker-end="url(#filled)"/><rect x="249.65" y="171" width="50.699999999999996" height="16" fill="white" fill-opacity="0.9"/><text x="275.0" y="183" text-anchor="middle" font-size="11" fill="#111">arranca</text><line x1="420" y1="240" x2="420" y2="310" stroke="#222" stroke-width="1.5" marker-end="url(#filled)"/><rect x="426" y="257.0" width="75.1" height="16" fill="white" fill-opacity="0.9"/><text x="430" y="269.0" text-anchor="start" font-size="11" fill="#111">lee scripts</text><line x1="520" y1="175" x2="650" y2="175" stroke="#222" stroke-width="1.5" marker-end="url(#filled)"/><rect x="547.45" y="156" width="75.1" height="16" fill="white" fill-opacity="0.9"/><text x="585.0" y="168" text-anchor="middle" font-size="11" fill="#111">ejecuta SQL</text><line x1="520" y1="225" x2="650" y2="330" stroke="#222" stroke-width="1.5" marker-end="url(#filled)"/><rect x="519.75" y="278" width="160.5" height="16" fill="white" fill-opacity="0.9"/><text x="600" y="290" text-anchor="middle" font-size="11" fill="#111">registra versión aplicada</text><line x1="785" y1="110" x2="785" y2="140" stroke="#222" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#open)"/><rect x="791" y="118" width="111.69999999999999" height="16" fill="white" fill-opacity="0.9"/><text x="795" y="130" text-anchor="start" font-size="11" fill="#111">valida el esquema</text><text x="20" y="290" font-size="12" font-weight="bold">Leyenda</text><rect x="20" y="298" width="16" height="12" fill="#fff3c4" stroke="#333"/><text x="42" y="308" font-size="11">Aplicación</text><rect x="20" y="316" width="16" height="12" fill="#ffd9b3" stroke="#333"/><text x="42" y="326" font-size="11">Librería</text><rect x="20" y="334" width="16" height="12" fill="#d5f5d5" stroke="#333"/><text x="42" y="344" font-size="11">Base de datos</text><rect x="20" y="352" width="16" height="12" fill="#e8e8e8" stroke="#333"/><text x="42" y="362" font-size="11">Archivos del proyecto</text><line x1="20" y1="376" x2="50" y2="376" stroke="#222" stroke-width="1.5" marker-end="url(#filled)"/><text x="58" y="380" font-size="11">Flujo de ejecución</text><line x1="20" y1="394" x2="50" y2="394" stroke="#222" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="58" y="398" font-size="11">Comprobación</text></svg>