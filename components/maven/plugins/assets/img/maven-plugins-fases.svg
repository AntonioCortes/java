<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B" />
    </marker>
  </defs>

  <rect width="920" height="480" fill="#F8FAFC" rx="10" />

  <text x="460" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E293B">Vinculación de Plugins y Metas (Goals) a Fases del Ciclo de Vida</text>
  <text x="460" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Maven no ejecuta código por sí mismo: delega en los "Goals" (Metas) de los plugins vinculados</text>

  <!-- Phase 1: compile -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="250" height="110" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect width="250" height="28" rx="8" fill="#3B82F6" />
    <rect width="250" height="8" y="20" fill="#3B82F6" />
    <text x="125" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#DBEAFE">&lt;&lt;fase del ciclo: compile&gt;&gt;</text>
    <text x="125" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A">Fase: compile</text>
    <text x="125" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Recopila src/main/java</text>
    <text x="125" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2563EB">Genera bytecode en target/classes</text>
  </g>

  <!-- Plugin Goal 1: compiler:compile -->
  <g transform="translate(40, 270)" filter="url(#shadow)">
    <rect width="250" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="125" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1E40AF">&lt;&lt;plugin: maven-compiler-plugin&gt;&gt;</text>
    <text x="125" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A8A">Goal: compiler:compile</text>
    <text x="125" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Lanza javac con versión Java</text>
    <text x="125" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Procesa anotaciones (Lombok)</text>
  </g>
  <path d="M 165 210 L 165 270" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">ejecuta</text>

  <!-- Phase 2: test -->
  <g transform="translate(335, 100)" filter="url(#shadow)">
    <rect width="250" height="110" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="28" rx="8" fill="#10B981" />
    <rect width="250" height="8" y="20" fill="#10B981" />
    <text x="125" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#D1FAE5">&lt;&lt;fase del ciclo: test&gt;&gt;</text>
    <text x="125" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065F46">Fase: test</text>
    <text x="125" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Ejecuta src/test/java</text>
    <text x="125" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669">Si un test falla, detiene el build</text>
  </g>

  <!-- Plugin Goal 2: surefire:test -->
  <g transform="translate(335, 270)" filter="url(#shadow)">
    <rect width="250" height="110" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="125" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">&lt;&lt;plugin: maven-surefire-plugin&gt;&gt;</text>
    <text x="125" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#065F46">Goal: surefire:test</text>
    <text x="125" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Arranca motor JUnit / TestNG</text>
    <text x="125" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Crea reportes XML y de texto</text>
  </g>
  <path d="M 460 210 L 460 270" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">ejecuta</text>

  <!-- Phase 3: package -->
  <g transform="translate(630, 100)" filter="url(#shadow)">
    <rect width="250" height="110" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="250" height="28" rx="8" fill="#8B5CF6" />
    <rect width="250" height="8" y="20" fill="#8B5CF6" />
    <text x="125" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#EDE9FE">&lt;&lt;fase del ciclo: package&gt;&gt;</text>
    <text x="125" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6">Fase: package</text>
    <text x="125" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Empaqueta artefacto final</text>
    <text x="125" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7C3AED">Produce el .jar en target/</text>
  </g>

  <!-- Plugin Goal 3: spring-boot:repackage -->
  <g transform="translate(630, 270)" filter="url(#shadow)">
    <rect width="250" height="110" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="125" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6D28D9">&lt;&lt;plugin: spring-boot-maven-plugin&gt;&gt;</text>
    <text x="125" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6">Goal: spring-boot:repackage</text>
    <text x="125" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Empaqueta Fat JAR ejecutable</text>
    <text x="125" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Añade Tomcat embebido y deps</text>
  </g>
  <path d="M 755 210 L 755 270" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">ejecuta</text>

  <!-- Legend -->
  <g transform="translate(200, 425)">
    <rect width="520" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">Leyenda:</text>
    <text x="80" y="20" font-family="Arial, sans-serif" font-size="11" fill="#475569"><b>Fase:</b> Paso abstracto en la secuencia de construcción</text>
    <text x="350" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2563EB"><b>Goal (Meta):</b> Tarea real implementada por el Plugin</text>
  </g>
</svg>
