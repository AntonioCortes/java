<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B" />
    </marker>
  </defs>

  <rect width="920" height="450" fill="#F8FAFC" rx="10" />

  <text x="460" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E293B">Flujo de Generación de Proyectos con Arquetipos en Maven</text>
  <text x="460" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Un arquetipo es una plantilla predefinida que genera la estructura y el pom.xml inicial</text>

  <!-- Box 1: Catálogo de Arquetipos -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="250" height="150" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect width="250" height="28" rx="8" fill="#3B82F6" />
    <rect width="250" height="8" y="20" fill="#3B82F6" />
    <text x="125" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#DBEAFE">&lt;&lt;catalogo de plantillas&gt;&gt;</text>
    <text x="125" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A">Arquetipos en Maven Central</text>
    <text x="125" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569"><b>maven-archetype-quickstart</b></text>
    <text x="125" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B">(Aplicación Java estándar)</text>
    <text x="125" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569"><b>maven-archetype-webapp</b></text>
    <text x="125" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B">(Aplicación Web Servlet / WAR)</text>
  </g>

  <!-- Box 2: Comando mvn archetype:generate -->
  <g transform="translate(340, 110)" filter="url(#shadow)">
    <rect width="250" height="150" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="28" rx="8" fill="#10B981" />
    <rect width="250" height="8" y="20" fill="#10B981" />
    <text x="125" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#D1FAE5">&lt;&lt;comando de consola&gt;&gt;</text>
    <text x="125" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065F46">mvn archetype:generate</text>
    <text x="125" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">-DgroupId=com.petshop</text>
    <text x="125" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">-DartifactId=pet-service</text>
    <text x="125" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">-DarchetypeArtifactId=...</text>
    <text x="125" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669">-DinteractiveMode=false</text>
  </g>

  <!-- Box 3: Proyecto Generado -->
  <g transform="translate(640, 110)" filter="url(#shadow)">
    <rect width="240" height="150" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="240" height="28" rx="8" fill="#8B5CF6" />
    <rect width="240" height="8" y="20" fill="#8B5CF6" />
    <text x="120" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#EDE9FE">&lt;&lt;proyecto generado en disco&gt;&gt;</text>
    <text x="120" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6">pet-service/</text>
    <text x="120" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">├── pom.xml</text>
    <text x="120" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">└── src/</text>
    <text x="120" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">    ├── main/java/.../App.java</text>
    <text x="120" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">    └── test/java/.../AppTest.java</text>
  </g>

  <!-- Arrows -->
  <path d="M 290 185 L 340 185" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">usa</text>

  <path d="M 590 185 L 640 185" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">crea</text>

  <!-- Legend -->
  <g transform="translate(210, 390)">
    <rect width="500" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">Leyenda:</text>
    <text x="80" y="20" font-family="Arial, sans-serif" font-size="11" fill="#475569">Los arquetipos automatizan la creación de carpetas estándar y el pom.xml inicial</text>
  </g>
</svg>
